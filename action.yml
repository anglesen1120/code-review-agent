name: "Code Review Agent"
description: >-
  Reviews pull requests with a self-contained opencode agent and posts inline
  review threads + a summary comment. Unresolved threads block merge via GitHub
  branch protection. No external review SaaS.
author: "anglesen1120"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  api-key:
    description: >-
      Provider API key for the opencode analyzer (OpenAI-compatible endpoint).
    required: true
  github-token:
    description: >-
      Token with pull-requests: write and contents: read. Defaults to
      github.token, which CAN post threads but CANNOT resolve them (GitHub
      limitation — fine-grained PATs have the same restriction). Pass a
      CLASSIC PAT with the repo scope to enable auto-resolve of review
      threads.
    required: false
    default: ${{ github.token }}
  base-url:
    description: "Provider endpoint base URL (OpenAI-compatible)."
    required: false
    default: "https://opencode.ai/zen/go/v1"
  model:
    description: "Provider/model for the analyzer, e.g. go/deepseek-v4.1-flash."
    required: false
    default: "go/deepseek-v4.1-flash"
  diff-scope:
    description: "Extra comma-separated gitignore-style patterns to exclude from review."
    required: false
    default: ""
  max-diff-bytes:
    description: "Diff budget sent to the model; whole files beyond it are skipped and listed in the summary."
    required: false
    default: "250000"
  fail-on:
    description: >-
      Fail the step when issues of this severity remain open: none | critical |
      warning. With anything but none, a failed analysis also fails the step.
    required: false
    default: "none"
  set-status:
    description: "Also set a commit status (needs statuses: write)."
    required: false
    default: "false"
  sarif-file:
    description: "Write a SARIF 2.1.0 report to this path (e.g. for github/codeql-action/upload-sarif)."
    required: false
    default: ""
  bot-login:
    description: >-
      Login of the token that posts/resolves review threads. For github.token
      this is "github-actions". When supplying a personal access token via
      github-token, set this to your GitHub username so the agent recognises
      its own threads.
    required: false
    default: "github-actions"
  opencode-version:
    description: "opencode-ai npm version used by the analyzer."
    required: false
    default: "1.18.18"

outputs:
  findings-count:
    description: "Total findings (all severities) for this run."
    value: ${{ steps.review.outputs.findings-count }}
  unresolved-count:
    description: "Open Critical/Warning threads remaining after this run."
    value: ${{ steps.review.outputs.unresolved-count }}
  review-id:
    description: "GitHub review id created this run, if any."
    value: ${{ steps.review.outputs.review-id }}
  analysis-failed:
    description: "true when the analyzer could not produce valid findings."
    value: ${{ steps.review.outputs.analysis-failed }}

runs:
  using: "composite"
  steps:
    - name: Install opencode CLI
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.opencode-version }}
      run: npm install -g --no-audit --no-fund "opencode-ai@${OPENCODE_VERSION}"

    # Every input travels through env, never ${{ }} inside the script body
    # (no expression injection into bash).
    - name: Review
      id: review
      shell: bash
      env:
        CRA_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        CRA_BASE_URL: ${{ inputs.base-url }}
        CRA_MODEL: ${{ inputs.model }}
        CRA_EXCLUDE: ${{ inputs.diff-scope }}
        CRA_MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
        CRA_FAIL_ON: ${{ inputs.fail-on }}
        CRA_SET_STATUS: ${{ inputs.set-status }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        args=(review --platform github)
        if [ -n "$SARIF_FILE" ]; then args+=(--sarif "$SARIF_FILE"); fi
        node "$GITHUB_ACTION_PATH/bin/cra.js" "${args[@]}"
